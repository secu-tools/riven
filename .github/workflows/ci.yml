name: CI
run-name: ${{ github.workflow }} - ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Smoke tests: build the binary and run it as a subprocess
  # ---------------------------------------------------------------
  smoke:
    name: Smoke Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run smoke tests
        run: go test -buildvcs=false -v -tags smoke -count=1 -timeout 300s ./tests/smoke/

  # ---------------------------------------------------------------
  # Unit tests (all platforms)
  # ---------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # The timeout is per package. internal/qrcode is the long pole: its photo
      # tests synthesise large frames pixel by pixel -- a "tiny in frame" case is
      # a 7266x7266 image -- and the race detector instruments every one of those
      # accesses. That package alone runs about 70s here and over 900s on a macOS
      # arm64 runner under -race, so the limit is set where the work actually is
      # rather than trimming a test that covers photographing a printed sheet.
      - name: Run unit tests
        run: go test -v -race -count=1 -timeout 2400s ./...

  # ---------------------------------------------------------------
  # Integration tests (all platforms)
  # ---------------------------------------------------------------
  integration:
    name: Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        run: go test -v -tags integration -race -count=1 -timeout 900s ./tests/integration/

  # ---------------------------------------------------------------
  # End-to-end tests: the compiled binary, every protection mode
  # ---------------------------------------------------------------
  e2e:
    name: E2E Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run e2e tests
        run: go test -v -tags e2e -count=1 -timeout 1800s ./tests/e2e/

  # ---------------------------------------------------------------
  # Fuzz: seed corpus (deterministic regression gate, Linux only)
  # ---------------------------------------------------------------
  fuzz-seed-corpus:
    name: Fuzz Seed Corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run fuzz seed corpus
        run: go test -count=1 -run '^Fuzz' ./internal/...

  # ---------------------------------------------------------------
  # Fuzz: mutation (exploratory, 10s per target, blocks CI on failure)
  # -run='^$' suppresses regular test execution so only the named fuzz
  # target runs; this ensures a non-zero exit means the fuzzer itself
  # found a failure, not an unrelated unit test.
  # ---------------------------------------------------------------
  fuzz-mutation:
    name: Fuzz Mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run fuzz mutation (10s per target)
        shell: bash
        run: |
          set -e
          FUZZ_TIME="10s"
          FAILED=false
          for pkg in $(go list -buildvcs=false ./internal/...); do
            while IFS= read -r func; do
              [ -z "$func" ] && continue
              echo "=== Fuzzing $func in $pkg for $FUZZ_TIME ==="
              # The Go fuzz coordinator has a known shutdown race: when
              # -fuzztime expires while workers are mid-execution, the run
              # can FAIL with a bare "context deadline exceeded" even though
              # no bug was found (golang/go#56238). A genuine finding always
              # writes a crasher ("Failing input written to testdata/...").
              # So: fail immediately on a real crasher, otherwise retry the
              # target once before declaring failure.
              for attempt in 1 2; do
                if out=$(go test -buildvcs=false -run='^$' -fuzz="^${func}$" -fuzztime="$FUZZ_TIME" -count=1 "$pkg" 2>&1); then
                  echo "$out"
                  break
                fi
                echo "$out"
                if echo "$out" | grep -q "Failing input written to"; then
                  FAILED=true
                  break
                fi
                if [ "$attempt" -eq 2 ]; then
                  FAILED=true
                else
                  echo "--- Spurious fuzz shutdown failure (no failing input recorded); retrying $func once ---"
                fi
              done
            done < <(go test -buildvcs=false -list "^Fuzz" "$pkg" 2>/dev/null | grep "^Fuzz" || true)
          done
          if $FAILED; then exit 1; fi

  # ---------------------------------------------------------------
  # Lint: vet, format, ineffectual assignments, spelling, complexity
  # ---------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./tests/integration/
          go vet -tags e2e ./tests/e2e/
          go vet -tags smoke ./tests/smoke/

      - name: Format check
        shell: bash
        run: |
          # internal/shamir is vendored third-party source and is left as-is.
          unformatted=$(gofmt -l . | grep -v '^internal/shamir/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Install linters
        run: |
          go install github.com/gordonklaus/ineffassign@latest
          go install github.com/client9/misspell/cmd/misspell@latest
          go install github.com/uudashr/gocognit/cmd/gocognit@latest

      - name: Ineffectual assignments
        run: ineffassign ./...

      - name: Spelling
        run: misspell -error .

      - name: Cognitive complexity
        shell: bash
        run: |
          # Production code only (test helpers and table-driven tests are exempt)
          # at threshold 25. gocognit exits zero either way, so its output decides.
          report=$(gocognit -over 25 -ignore '_test\.go|internal/shamir/' ./internal/)
          if [ -n "$report" ]; then
            echo "::error::These functions exceed a cognitive complexity of 25:"
            echo "$report"
            exit 1
          fi

      - name: ASCII only
        shell: bash
        run: |
          # Comments, docs and messages stay ASCII so they render the same in
          # every console and editor. Two exceptions carry non-ASCII on purpose:
          # the vendored shamir copy, and the tests whose subject is Unicode
          # password handling (composition, scripts, legacy encodings).
          files=$(grep -rlP '[^\x00-\x7F]' \
            --include='*.go' --include='*.md' --include='*.yml' \
            --include='*.sh' --include='*.ps1' --include='*.cmd' . \
            | grep -v '^./internal/shamir/' \
            | grep -v '^./internal/password/password_test\.go$' \
            | grep -v '^./internal/core/i18n_test\.go$' \
            | grep -v '^./internal/app/split_output_test\.go$' || true)
          if [ -n "$files" ]; then
            echo "::error::These files contain non-ASCII characters:"
            echo "$files"
            exit 1
          fi

  # ---------------------------------------------------------------
  # Vendored Shamir: fail when the upstream copy drifts
  # ---------------------------------------------------------------
  vendored-shamir:
    name: Vendored Shamir Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # internal/shamir is a copy of an MPL-2.0 file from a BUSL-1.1 repository,
      # so it cannot be tracked by go modules. Fail the build when upstream moves,
      # rather than letting the copy drift unnoticed. See internal/shamir/UPSTREAM.
      - name: Compare against upstream
        shell: bash
        run: |
          base=https://raw.githubusercontent.com/hashicorp/vault/main/shamir
          status=0
          for f in shamir.go shamir_test.go; do
            curl -fsSL "$base/$f" -o "upstream-$f"
            if ! diff -u "upstream-$f" "internal/shamir/$f"; then
              echo "::error::internal/shamir/$f differs from upstream; see internal/shamir/UPSTREAM"
              status=1
            fi
          done
          grep -q 'SPDX-License-Identifier: MPL-2.0' internal/shamir/shamir.go || {
            echo "::error::the vendored shamir file lost its MPL-2.0 header"; status=1; }
          exit $status

  # ---------------------------------------------------------------
  # Cross-compile every release target
  # ---------------------------------------------------------------
  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every target
        # Invoked through bash so the job does not depend on the executable bit
        # surviving however the tree reached the runner.
        run: bash ./build.sh -all

  # ---------------------------------------------------------------
  # Vulnerability check (informational -- does not block CI)
  # ---------------------------------------------------------------
  govulncheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
